<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon com AVISO (14/10/2026): o mesmo de favicon.svg + um ponto vermelho no
       canto, usado pelo balão de avisos quando há equipe abaixo do esperado.
       Silencioso: só muda o ícone da aba, sem som nem popup. -->
  <defs>
    <clipPath id="raio">
      <path d="M48,4 L22,46 L36,46 L16,82 L62,38 L48,38 Z"/>
    </clipPath>
    <clipPath id="canto">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#canto)">
    <rect width="64" height="64" fill="#231F20"/>
    <rect y="58" width="32" height="6" fill="#FEC40E"/>
    <rect x="32" y="58" width="32" height="6" fill="#086738"/>
  </g>
  <g transform="translate(6.3 2.6) scale(0.66)">
    <path d="M48,4 L22,46 L36,46 L16,82 L62,38 L48,38 Z" fill="#FEC40E"/>
    <polygon points="48,4 70,4 46,46 22,46" fill="#ED1C24" clip-path="url(#raio)"/>
  </g>
  <circle cx="50" cy="14" r="13" fill="#ED1C24" stroke="#FFFFFF" stroke-width="4"/>
</svg>
